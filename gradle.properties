# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx4G -Dnet.minecraftforge.gradle.check.certs=false
org.gradle.daemon=false

## Environment Properties

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

## Mod Properties

# Must match the String constant MODID in the main mod class.
mod_id=ohnomoremeteors
mod_name=Oh No, More Meteors!
mod_license=All Rights Reserved
mod_version=0.1.0
mod_group_id=com.temog.notminelegacy.ohnomoremeteors
mod_authors=Temog
mod_description=An add-on for Oh My, Meteors! that adds fire and ice meteors (Cindrite and Rimerite) with their own crater blocks.

## Required dependency (dev jar staged from run/mods_raw, see the build script)

# Version of Oh My, Meteors! used on the compile and dev-run classpath.
omm_version=1.6.0
# Exact file name of that jar inside run/mods_raw.
omm_jar=ohmymeteors-1.6.0+1.20.1+forge.jar

# Version of Not Mine Legacy (temperature API, REQUIRED since pass 2) used on the compile and dev-run classpath.
nml_version=1.2.0
# Exact file name of that jar inside run/mods_raw (built by the Not Mine Legacy repo, not a public download).
nml_jar=notminelegacy-1.2.0.jar
