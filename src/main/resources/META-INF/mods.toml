modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Oh My, Meteors! is REQUIRED: this mod hooks its meteor entity and loads after it.
[[dependencies.${mod_id}]]
modId="ohmymeteors"
mandatory=true
versionRange="[1.5.0,)"
ordering="AFTER"
side="BOTH"

# Not Mine Legacy is REQUIRED: its temperature API (1.2.0 or newer) drives the hot/cold behaviour of
# Cindrite, Rimerite, the biome-weighted meteor roll and the thermal source data.
[[dependencies.${mod_id}]]
modId="notminelegacy"
mandatory=true
versionRange="[1.2.0,)"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="ohnomoremeteors.mixins.json"
