plugins {
    id 'eclipse'
    id 'idea'
    // Same pinned plugin versions as Building Bridges.
    id 'net.minecraftforge.gradle' version '6.0.54'
    // Generates the mixin refmap at compile time (ohnomoremeteors.refmap.json) and wires it into reobfJar.
    id 'org.spongepowered.mixin' version '0.7.38'
}

mixin {
    add sourceSets.main, 'ohnomoremeteors.refmap.json'
    config 'ohnomoremeteors.mixins.json'
}

def mod_version = project.hasProperty('mod_version') ? project.mod_version : '0.1.0'
def mod_group_id = project.hasProperty('mod_group_id') ? project.mod_group_id : 'com.temog.notminelegacy.ohnomoremeteors'
def mod_id = project.hasProperty('mod_id') ? project.mod_id : 'ohnomoremeteors'
def mapping_channel = project.hasProperty('mapping_channel') ? project.mapping_channel : 'official'
def mapping_version = project.hasProperty('mapping_version') ? project.mapping_version : '1.20.1'
def minecraft_version = project.hasProperty('minecraft_version') ? project.minecraft_version : '1.20.1'
def forge_version = project.hasProperty('forge_version') ? project.forge_version : '47.4.10'
def minecraft_version_range = project.hasProperty('minecraft_version_range') ? project.minecraft_version_range : '[1.20.1,1.21)'
def forge_version_range = project.hasProperty('forge_version_range') ? project.forge_version_range : '[47,)'
def loader_version_range = project.hasProperty('loader_version_range') ? project.loader_version_range : '[47,)'
def mod_name = project.hasProperty('mod_name') ? project.mod_name : 'Oh No, More Meteors!'
def mod_license = project.hasProperty('mod_license') ? project.mod_license : 'All Rights Reserved'
def mod_authors = project.hasProperty('mod_authors') ? project.mod_authors : 'Temog'
def mod_description = project.hasProperty('mod_description') ? project.mod_description : 'A Minecraft mod.'
def omm_version = project.hasProperty('omm_version') ? project.omm_version : '1.5.0'
def omm_jar = project.hasProperty('omm_jar') ? project.omm_jar : 'ohmymeteors-1.5.0+1.20.1+forge.jar'
def nml_version = project.hasProperty('nml_version') ? project.nml_version : '1.2.0'
def nml_jar = project.hasProperty('nml_jar') ? project.nml_jar : 'notminelegacy-1.2.0.jar'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so the mod targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Runs ProcessResources on IDE output before launching the game.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.console.level', 'info'

            // Lets third-party mixin refmaps (OMM ships one) be remapped to the official dev names.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', file('build/createSrgToMcp/output.srg').absolutePath

            // This repo ships exactly one mixin config; one that is registered in mods.toml but not
            // here silently never loads in dev.
            arg '-mixin.config=ohnomoremeteors.mixins.json'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators (none yet).
sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }

    // This project intentionally has no src/test tree.
    test {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
}

// --- Dev-jar staging for the REQUIRED dependencies (Oh My, Meteors! and Not Mine Legacy).
// ForgeGradle can only remap (deobfuscate) a jar that comes from a Maven-layout repository, not from
// files(...). So each jar dropped in run/mods_raw is copied, at configuration time, into a tiny local
// Maven repo under build/ as local.runmods:<artifact>:<version>, then pulled in through fg.deobf.
def stagedRepoDir = layout.buildDirectory.dir('stagedRunModsRepo').get().asFile

// Copies one dev jar plus a generated pom into the staged repo. Fails the build with a clear message
// when the source jar is missing.
def stageRunModJar = { File sourceJar, artifactId, artifactVersion, missingHint ->
    if (!sourceJar.exists()) {
        throw new GradleException("Missing dev jar ${sourceJar} - ${missingHint} (see DEV_JARS.md in _reference/oh-no-more-meteors).")
    }
    def artifactDir = new File(stagedRepoDir, "local/runmods/${artifactId}/${artifactVersion}")
    artifactDir.mkdirs()
    def jarOut = new File(artifactDir, "${artifactId}-${artifactVersion}.jar")
    // Only recopy when the source changed, so an unchanged repo keeps its timestamps (and the deobf cache).
    if (!jarOut.exists() || jarOut.length() != sourceJar.length() || jarOut.lastModified() != sourceJar.lastModified()) {
        java.nio.file.Files.copy(sourceJar.toPath(), jarOut.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.COPY_ATTRIBUTES)
    }
    def pomOut = new File(artifactDir, "${artifactId}-${artifactVersion}.pom")
    pomOut.text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
         xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
  <modelVersion>4.0.0</modelVersion>
  <groupId>local.runmods</groupId>
  <artifactId>${artifactId}</artifactId>
  <version>${artifactVersion}</version>
  <packaging>jar</packaging>
</project>
"""
}
// fg.deobf dependencies resolve while compileJava calculates its classpath, so the repo must exist already.
stageRunModJar(file("run/mods_raw/${omm_jar}"), 'ohmymeteors', omm_version,
        "download Oh My, Meteors! ${omm_version} (Forge 1.20.1) into run/mods_raw first")
stageRunModJar(file("run/mods_raw/${nml_jar}"), 'notminelegacy', nml_version,
        "copy notminelegacy-${nml_version}.jar (built by the Not Mine Legacy repo) into run/mods_raw first")
stageRunModJar(file("run/mods_raw/${jei_jar}"), 'jei', jei_version,
        "download JEI ${jei_version} (Forge 1.20.1) into run/mods_raw first (compile-only, for the optional JEI tab)")

repositories {
    // Same repository list as Building Bridges (keeps the offline Gradle cache valid).
    maven { url 'https://modmaven.dev' }
    maven { url 'https://maven.blamejared.com' }
    maven { url 'https://dvs1.progwml6.com/files/maven' }

    // Local Maven repo holding the staged OMM and NML dev jars.
    maven {
        url stagedRepoDir
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // MixinExtras - bundled with Forge 47.4 at runtime, needed at compile time for its annotations.
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.3.5"))

    // Mixin annotation processor - generates ohnomoremeteors.refmap.json at compile time.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Oh My, Meteors! - REQUIRED dependency (mods.toml). Compile classpath, plus dev runs.
    // Never shipped inside this mod's jar.
    compileOnly fg.deobf("local.runmods:ohmymeteors:${omm_version}")
    runtimeOnly fg.deobf("local.runmods:ohmymeteors:${omm_version}")

    // Not Mine Legacy - REQUIRED dependency since pass 2 (mods.toml): the temperature API
    // (com.temog.notminelegacy.environment.temperature). Compile classpath, plus dev runs. Never shipped inside this mod's jar.
    compileOnly fg.deobf("local.runmods:notminelegacy:${nml_version}")
    runtimeOnly fg.deobf("local.runmods:notminelegacy:${nml_version}")

    // Just Enough Items - OPTIONAL (mods.toml). Compile-only: the @JeiPlugin class in compat/jei is only loaded by
    // JEI itself, so the mod runs without it. Never shipped inside this mod's jar.
    compileOnly fg.deobf("local.runmods:jei:${jei_version}")
}

def sharedReplaceProperties = [
    minecraft_version      : minecraft_version,
    minecraft_version_range: minecraft_version_range,
    forge_version          : forge_version,
    forge_version_range    : forge_version_range,
    loader_version_range   : loader_version_range,
    mod_id                 : mod_id,
    mod_name               : mod_name,
    mod_license            : mod_license,
    mod_version            : mod_version,
    mod_authors            : mod_authors,
    mod_description        : mod_description,
]

// Expands the declared replace properties in mods.toml and pack.mcmeta; a missing property is a build error.
tasks.named('processResources', ProcessResources).configure {
    inputs.properties sharedReplaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand sharedReplaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : mod_id,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : 'ohnomoremeteors.mixins.json'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // ResourceLocation(String, String) is deprecated-for-removal in 1.20.1 official mappings but the
    // replacement does not exist until 1.20.5; silence the lint categories.
    options.compilerArgs << '-Xlint:-removal' << '-Xlint:-deprecation' << '-Xlint:-unchecked'
}
